<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>GENESIS Firewall</title>
    <style>
      body { width: 260px; margin: 0; padding: 16px; font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; }
      h1 { font-size: 15px; margin: 0 0 4px; }
      p { font-size: 12px; color: #94a3b8; margin: 0 0 12px; }
      .status { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #2dd4bf; }
      a { color: #5eead4; font-size: 12px; text-decoration: none; }
      .toggle-row { display: flex; align-items: center; justify-content: space-between; margin: 14px 0; padding: 10px 12px; background: #1e293b; border-radius: 8px; }
      .toggle-row span { font-size: 13px; }
      .status-text { font-size: 11px; color: #94a3b8; margin: -8px 0 10px 2px; }
      button.connect-btn { width: 100%; padding: 8px; border-radius: 8px; border: none; background: #2dd4bf; color: #0f172a; font-weight: 700; font-size: 12px; cursor: pointer; margin-bottom: 8px; }
      button.connect-btn:disabled { opacity: 0.6; cursor: default; }
      a.disconnect-link { color: #f87171; }
    </style>
  </head>
  <body>
    <h1>GENESIS Firewall</h1>
    <div class="status"><span class="dot"></span> Active - screening signatures &amp; transactions</div>
    <p>Works with any wallet. No setup needed.</p>
    <div class="toggle-row">
      <span>Protection enabled</span>
      <input type="checkbox" id="enabled-toggle" checked />
    </div>
    <div class="toggle-row">
      <span>Deep Check protection</span>
      <input type="checkbox" id="deep-check-toggle" />
    </div>
    <div class="status-text" id="deep-check-status">Off - checks the community threat feed only.</div>
    <button class="connect-btn" id="connect-btn" style="display:none">Connect wallet &amp; enable</button>
    <a id="buy-credits-link" href="https://sadhutech.com/pro" target="_blank" rel="noopener" style="display:none">Buy more credits &rarr;</a>
    <a id="disconnect-link" class="disconnect-link" href="#" style="display:none">Disconnect / switch wallet</a>
    <a href="https://sadhutech.com/check" target="_blank" rel="noopener">Open GENESIS Check &rarr;</a>
    <script src="popup.js"></script>
  </body>
</html>
